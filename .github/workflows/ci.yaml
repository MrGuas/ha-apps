name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-addon:
    name: Lint de la App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./whatsapp_puente

  go:
    name: Go (fmt, vet, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp_puente/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp_puente/app/go.mod
          cache-dependency-path: whatsapp_puente/app/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build -trimpath -o /dev/null .

  docker:
    name: Imagen (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: go
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: whatsapp_puente
          push: false
          build-args: BUILD_VERSION=ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
