version: 2
updates:
  - package-ecosystem: gomod
    directory: /whatsapp_puente/app
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /whatsapp_puente
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
