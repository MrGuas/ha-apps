name: WhatsApp puente
version: "0.3.0"
slug: whatsapp_puente
description: Guarda tus conversaciones de WhatsApp (solo texto) y programa envíos desde Home Assistant.
url: https://github.com/MrGuas/ha-apps
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8080
panel_icon: mdi:whatsapp
panel_title: WhatsApp
backup_exclude:
  - "*.db"
  - "*.db-wal"
  - "*.db-shm"
options:
  api_token: ""
  allowed_send: []
  notify_service: notify.mobile_app_aitoroneplus
  max_per_day: 20
  late_minutes: 30
schema:
  api_token: password
  allowed_send:
    - str
  notify_service: str
  max_per_day: int(1,200)
  late_minutes: int(1,1440)
