name: WhatsApp puente
version: "0.4.0"
slug: whatsapp_puente
description: Guarda el texto de tus conversaciones de WhatsApp y programa envíos desde Home Assistant.
url: https://github.com/MrGuas/ha-apps/tree/main/whatsapp_puente
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8080
panel_icon: mdi:whatsapp
panel_title: WhatsApp
backup_exclude:
  - "*.db"
  - "*.db-wal"
  - "*.db-shm"
options:
  api_token: ""
  allowed_send: []
  notify_service: ""
  country_code: "34"
  max_per_day: 20
  late_minutes: 30
schema:
  api_token: password?
  allowed_send:
    - str
  notify_service: str?
  country_code: match(^\+?[0-9]{1,4}$)
  max_per_day: int(1,200)
  late_minutes: int(1,1440)
